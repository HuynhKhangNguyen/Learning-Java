spring.application.name=content-service
spring.main.web-application-type=servlet
spring.main.banner-mode=off
spring.web.resources.add-mappings=false
server.forward-headers-strategy=none
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

# No implicit lab/pilot profile or trusted public/private listeners in R01c.
# Start explicitly with --spring.profiles.active=bootstrap for local smoke only.
